# secops-guard - pip cooldown
# Requires pip >= 26.1 for the relative ISO-8601 duration below.
# pip 26.0 added --uploaded-prior-to but accepts an absolute date only.
# Older pip rejects the option outright, so the installer skips this file.
# Upgrade: `python -m pip install --upgrade pip`
# Env equivalent: PIP_UPLOADED_PRIOR_TO
# On Linux/macOS this same content belongs in ~/.config/pip/pip.conf.
[install]
uploaded-prior-to = P@DAYS@D
